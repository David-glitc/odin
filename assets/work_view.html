<title>/*TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f8fa;--panel:#fff;--line:#d0d7de;--fg:#1f2328;--mute:#656d76;--soft:#eaeef2;--good:#1a7f37;--goodbg:#dafbe1;--warn:#9a6700;--warnbg:#fff8c5;--info:#0969da;--infobg:#ddf4ff;--blk-done:#1baf7a;--blk-wait:#eda100;--blk-open:#2a78d6;--shadow:0 8px 30px rgba(0,0,0,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;--soft:#21262d;--good:#3fb950;--goodbg:#12261a;--warn:#d29922;--warnbg:#2d2208;--info:#58a6ff;--infobg:#0c2d4a;--shadow:0 8px 30px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mute:#8b949e;--soft:#21262d;--good:#3fb950;--goodbg:#12261a;--warn:#d29922;--warnbg:#2d2208;--info:#58a6ff;--infobg:#0c2d4a;--shadow:0 8px 30px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 Inter,system-ui,sans-serif;max-width:960px;margin:0 auto;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0;overflow-wrap:anywhere}h2{font-size:15px;margin:0 0 8px}.mute{color:var(--mute)}.small{font-size:12px}
button,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--info)}
button:focus-visible,input:focus-visible,a:focus-visible,.blk:focus-visible{outline:2px solid var(--info);outline-offset:1px}
button.on{border-color:var(--info);color:var(--info);background:var(--infobg)}
a{color:var(--info)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.sp{justify-content:space-between}
header{padding-top:16px}
#tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:2px;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow-x:auto}
#tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;white-space:nowrap;color:var(--mute)}
#tabs button.on{color:var(--fg);border-bottom-color:var(--info);background:none}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--soft);font-size:11px;text-align:center;color:var(--fg)}
.badge.w{background:var(--blk-wait);color:#1f2328}
.view[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.lb{font-size:12px;color:var(--mute);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.goal{font-size:19px;line-height:1.4;font-weight:600;margin-bottom:14px;overflow-wrap:anywhere}
.card p{margin:0 0 10px;max-width:70ch}
sup a{font-size:11px;text-decoration:none;padding:0 2px;font-weight:600}
sup a:hover{text-decoration:underline}
ol.fnl{margin:8px 0 0;padding-left:22px;font-size:12px;color:var(--mute)}ol.fnl li{margin:2px 0}ol.fnl a{color:var(--fg)}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-bottom:14px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left;min-width:0;display:block}.chip b{display:block;font-size:21px;font-weight:600;line-height:1.2}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--mute);margin:10px 0}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.day{display:flex;gap:10px;align-items:flex-start;padding:4px 0;border-bottom:1px solid var(--line)}.day .d{flex:none;width:64px;font-size:12px;color:var(--mute);padding-top:3px}
.blks{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.blk{width:22px;height:22px;border-radius:4px;border:0;padding:0;position:relative;color:#fff;font-size:10px}
.blk.sel{outline:2px solid var(--fg);outline-offset:1px}.blk.dim{opacity:.18}
.blk i{position:absolute;right:-1px;top:-3px;font-style:normal;font-size:9px;color:var(--fg)}
.item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:9px 4px}
.item:hover{background:var(--soft)}.item .n{flex:none;min-width:28px;color:var(--mute);font-size:12px;padding-top:2px}
.item .b{flex:1;min-width:0}.item .t{overflow-wrap:anywhere}
.pill{font-size:11px;border-radius:9px;padding:1px 8px;white-space:nowrap}
.pill.done{background:var(--goodbg);color:var(--good)}.pill.wait{background:var(--warnbg);color:var(--warn)}.pill.open{background:var(--infobg);color:var(--info)}
.step{display:flex;align-items:center;gap:10px;margin:0 0 6px}.dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;font-weight:600}
.cp{font-size:12px;background:var(--soft);border-radius:6px;padding:3px 8px;display:inline-block;margin:0 6px 6px 0;overflow-wrap:anywhere;color:var(--fg);text-decoration:none}
.cp.pick{background:var(--goodbg);color:var(--good)}
.fd{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 8px;line-height:1.6}
.bar{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}.bar>div{height:100%;background:var(--blk-done);width:0;transition:width .4s}
.need{background:var(--warnbg);border-radius:10px;padding:11px 13px;margin-bottom:10px}.need .t{font-size:12px;color:var(--warn);margin-bottom:4px}
.sec{transition:opacity .5s;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mute);font-weight:500}
td.num{width:60px;color:var(--mute)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#ov.open{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);max-width:100vw;background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s;z-index:21;display:flex;flex-direction:column}
#dr.open{transform:none}
#dh{padding:12px 16px;border-bottom:1px solid var(--line);flex:none}
#db{padding:14px 16px 30px;overflow:auto;flex:1;min-width:0;overflow-wrap:anywhere}
@media(max-width:600px){#dr{top:auto;height:88vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#help{position:absolute;right:0;top:36px;z-index:6;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
#help[hidden]{display:none}#help div{display:flex;justify-content:space-between;margin:3px 0}kbd{background:var(--soft);border-radius:4px;padding:0 6px;font:12px ui-monospace,monospace}
</style>
<div id="main">
<header>
<div class="row sp"><h1 id="h1"></h1>
<span class="row" style="position:relative"><button id="theme">Theme</button><button id="cp">Copy report</button><button id="rp">Replay</button><button id="hb" aria-label="Keyboard help" aria-expanded="false">?</button>
<div id="help" hidden><div><span>Tabs</span><kbd>1 – 5</kbd></div><div><span>Next or previous task</span><kbd>j / k</kbd></div><div><span>Search tasks</span><kbd>/</kbd></div><div><span>Replay the work</span><kbd>r</kbd></div><div><span>Close panel</span><kbd>Esc</kbd></div></div></span></div>
<div class="mute small" id="sub"></div>
</header>
<nav id="tabs" role="tablist" aria-label="Views"></nav>

<section class="view" id="v-over"></section>

<section class="view" id="v-tasks" hidden>
<div class="row" id="filters"></div>
<div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="Search tasks" aria-label="Search tasks" style="flex:1;min-width:160px"><button id="lv" aria-pressed="false">List view</button><span class="small mute" id="count"></span></div>
<div class="legend"><span><i class="sw" style="background:var(--blk-done)"></i>Finished</span><span><i class="sw" style="background:var(--blk-wait)"></i>Waiting on you</span><span><i class="sw" style="background:var(--blk-open)"></i>Plan unfinished</span><span>◆ decision &nbsp; ▲ shipped</span></div>
<div id="days"></div>
</section>

<section class="view" id="v-decs" hidden></section>
<section class="view" id="v-chg" hidden></section>
<section class="view" id="v-need" hidden></section>
<div class="small mute" id="cov" style="margin-top:16px;line-height:1.6"></div>
</div>

<div id="ov"></div>
<aside id="dr" role="dialog" aria-modal="true" aria-labelledby="title" aria-hidden="true">
<div id="dh"><div class="row sp"><span class="small mute" id="when"></span><span class="row"><button id="pv" aria-label="Previous task">‹</button><button id="nx" aria-label="Next task">›</button><button id="dc" aria-label="Copy this task as text">Copy</button><button id="dl" aria-label="Copy link to this task">Link</button><button id="x" aria-label="Close">✕</button></span></div></div>
<div id="db">
<div id="title" style="font-size:18px;font-weight:600;margin:0 0 2px"></div>
<div id="raw" class="small mute" style="font-style:italic;margin-bottom:12px"></div>
<div class="need" id="need" hidden><div class="t">Needs you (reply in the chat)</div><div id="ask" style="margin-bottom:6px"></div><div id="opts"></div></div>
<div class="sec" id="s1"><div class="lb">Steps</div><div class="row" style="flex-wrap:nowrap;margin-bottom:8px"><div class="bar"><div id="bar"></div></div><span class="small mute" id="pct"></span></div><div id="steps"></div></div>
<div class="sec" id="s2"><div class="lb">What it found</div><div id="finds"></div></div>
<div class="sec" id="s3"><div class="lb">Decisions</div><div id="decs"></div></div>
<div class="sec" id="s4"><div class="lb">What changed</div><div id="outs"></div></div>
</div>
</aside>
<div id="toast" role="status"></div>
<script>
const META=/*META*/{"name":"Work","base":0,"total":0,"note":""},DATA=/*DATA*/[];
const $=id=>document.getElementById(id),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],N=DATA.length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const U=m=>new Date(META.base+m*60000),dt=m=>{const x=U(m);return x.getUTCDate()+' '+MO[x.getUTCMonth()]+' '+String(x.getUTCHours()).padStart(2,'0')+':'+String(x.getUTCMinutes()).padStart(2,'0')+' UTC'};
const fm=m=>m<1?'under 1 min':m<60?Math.round(m)+' min':m<2880?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' days';
const status=d=>d.ask?'wait':(d.st.length&&d.st.some(s=>s[1]!='c'))?'open':'done';
const COL={done:'var(--blk-done)',wait:'var(--blk-wait)',open:'var(--blk-open)'},LAB={done:'Finished',wait:'Waiting on you',open:'Plan unfinished'};
const shipped=d=>d.dp.length+d.cm.length+d.ln.length;
let cur=-1,view='over',flt='all',qs='',lm=false,rp=false,timer=null,opener=null,showAll=false;
const F={all:['All',()=>true],wait:['Waiting on you',d=>!!d.ask],dec:['Decisions',d=>d.de.length>0],dep:['Shipped',d=>shipped(d)>0],fil:['Files changed',d=>d.nfl>0],open:['Plan unfinished',d=>status(d)=='open']};
const vis=i=>{const d=DATA[i];return F[flt][1](d)&&(!qs||(d.ti+' '+d.g+' '+d.fi.map(f=>f.x).join(' ')).toLowerCase().includes(qs))};
const fn=s=>esc(s).replace(/\[(\d+)\]/g,(m,n)=>+n>=1&&+n<=N?`<sup><a href="#t${n}" data-open="${n-1}" aria-label="Task ${n}">${n}</a></sup>`:m);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),1600)};
const copy=async s=>{try{await navigator.clipboard.writeText(s);toast('Copied');return}catch(e){}try{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copied')}catch(e){toast('Copy is blocked here')}};
const stat=()=>{const all=DATA.flatMap(x=>x.st),dn=all.filter(x=>x[1]=='c').length;return {all,dn,w:DATA.filter(d=>d.ask).length,dec:DATA.reduce((a,x)=>a+x.de.length,0),fi:DATA.reduce((a,x)=>a+x.fi.length,0),files:new Set(DATA.flatMap(x=>Object.keys(x.fl))).size,sh:DATA.reduce((a,x)=>a+shipped(x),0)}};
const TABS=[['over','Overview'],['tasks','Tasks'],['decs','Decisions'],['chg','Changes'],['need','Needs you']];

function tabs(){const s=stat();$('tabs').innerHTML=TABS.map((t,i)=>{const b=t[0]=='tasks'?N:t[0]=='decs'?s.dec:t[0]=='need'?s.w:0;return `<button role="tab" aria-selected="${t[0]==view}" class="${t[0]==view?'on':''}" data-tab="${t[0]}">${t[1]}${b?`<span class="badge ${t[0]=='need'?'w':''}">${b}</span>`:''}</button>`}).join('')}
function go(v,f){view=v;if(f)flt=f;tabs();TABS.forEach(t=>$('v-'+t[0]).hidden=t[0]!=v);({over,tasks,decs,chg,need})[v]();try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo({top:0})}

function over(){const s=stat(),refs=[];(META.paras||[]).forEach(p=>p.replace(/\[(\d+)\]/g,(m,n)=>{n=+n;if(n>=1&&n<=N&&!refs.includes(n))refs.push(n)}));
 const ch=[['Tasks',N+(META.total>N?' of '+META.total:''),'tasks','all'],['Steps done',s.dn+' of '+s.all.length,'tasks','open'],['Findings',s.fi,'tasks','all'],['Decisions',s.dec,'decs'],['Files changed',s.files,'chg'],['Shipped',s.sh,'chg'],['Waiting on you',s.w,'need']];
 const w=DATA.map((d,i)=>i).filter(i=>DATA[i].ask);
 $('v-over').innerHTML=`<div class="card"><div class="lb">Goal</div><div class="goal">${esc(META.goal||(DATA[0]&&DATA[0].g)||'')}</div>
 <div class="lb">Summary</div>${(META.paras||[]).map(p=>`<p>${fn(p)}</p>`).join('')||'<p class="mute">No summary was written. Open a task to see what it did.</p>'}
 ${refs.length?`<div class="lb" style="margin-top:14px">Notes</div><ol class="fnl" style="list-style:none;padding:0">${refs.map(n=>`<li><sup><a href="#t${n}" data-open="${n-1}">${n}</a></sup> <a href="#t${n}" data-open="${n-1}">${esc(DATA[n-1].ti)}</a> · ${dt(DATA[n-1].t)}</li>`).join('')}</ol>`:''}</div>
 <div class="chips">${ch.map(c=>`<button class="chip" data-tab="${c[2]}" ${c[3]?`data-flt="${c[3]}"`:''}><span class="small mute">${c[0]}</span><b>${c[1]}</b></button>`).join('')}</div>
 ${w.length?`<div class="card" style="background:var(--warnbg)"><div class="lb" style="color:var(--warn)">Needs you</div>${w.slice(-3).map(i=>`<div style="margin-bottom:6px">${esc(DATA[i].ask)} <sup><a href="#t${i+1}" data-open="${i}">${i+1}</a></sup></div>`).join('')}<button data-tab="need">See all ${w.length}</button></div>`:''}
 <div class="card"><div class="lb">All tasks in order</div><div class="blks">${DATA.map((d,i)=>blk(i,true)).join('')}</div></div>`}
function blk(i,ok){const d=DATA[i];return `<button class="blk ${i==cur?'sel':''} ${ok?'':'dim'}" data-open="${i}" style="background:${COL[status(d)]}" aria-label="Task ${i+1}: ${esc(d.ti)}" title="${esc(d.ti)}">${i+1}${d.de.length?'<i>◆</i>':shipped(d)?'<i>▲</i>':''}</button>`}

function filters(){$('filters').innerHTML=Object.entries(F).map(([k,v])=>`<button data-flt="${k}" class="${k==flt?'on':''}">${v[0]} ${DATA.filter(d=>v[1](d)).length}</button>`).join('')}
function tasks(){filters();$('lv').textContent=lm?'Block view':'List view';$('lv').setAttribute('aria-pressed',lm);let n=0;
 if(lm){const L=DATA.map((d,i)=>i).filter(vis).reverse();n=L.length;$('days').innerHTML=L.map(i=>{const d=DATA[i],s=status(d);return `<button class="item" data-open="${i}"><span class="n">${i+1}</span><span class="b"><span class="t">${esc(d.ti)}</span><span class="small mute" style="display:block">${dt(d.t)}${d.de.length?' · '+d.de.length+' decision'+(d.de.length>1?'s':''):''}${d.nfl?' · '+d.nfl+' file'+(d.nfl>1?'s':''):''}</span></span><span class="pill ${s}">${LAB[s]}</span></button>`}).join('')||'<p class="mute">No task matches.</p>'}
 else{const g={};DATA.forEach((d,i)=>{const x=U(d.t),k=x.getUTCFullYear()*10000+x.getUTCMonth()*100+x.getUTCDate();(g[k]=g[k]||[]).push(i)});
  $('days').innerHTML=Object.keys(g).sort((a,b)=>a-b).map(k=>{const x=U(DATA[g[k][0]].t);return `<div class="day"><div class="d">${x.getUTCDate()} ${MO[x.getUTCMonth()]}</div><div class="blks">${g[k].map(i=>{const v=vis(i);if(v)n++;return blk(i,v)}).join('')}</div></div>`}).join('')}
 $('count').textContent=n+' of '+N+' shown'}

function decs(){const L=[];DATA.forEach((d,i)=>d.de.forEach(y=>L.push([i,y])));L.reverse();
 $('v-decs').innerHTML=`<div class="row sp" style="margin-bottom:10px"><h2>${L.length} decision${L.length==1?'':'s'}</h2><span class="small mute">Newest first. Your answer is in green.</span></div>`+(L.map(([i,y])=>`<div class="card"><div style="margin-bottom:8px">${esc(y.q)}</div><div>${y.o.map(o=>`<span class="cp ${y.a&&y.a.toLowerCase()==o.toLowerCase()?'pick':''}">${esc(o)}</span>`).join('')}</div><div class="small mute" style="margin-top:4px">${y.a?'Your answer: "'+esc(y.a)+'"':'No answer recorded.'} · <a href="#t${i+1}" data-open="${i}">Task ${i+1}</a> · ${dt(DATA[i].t)}</div></div>`).join('')||'<p class="mute">No decisions were needed.</p>')}

function chg(){const F2={};DATA.forEach((d,i)=>Object.entries(d.fl).forEach(([k,v])=>{const o=F2[k]=F2[k]||{n:0,t:[]};o.n+=v;o.t.push(i)}));
 const fl=Object.entries(F2).sort((a,b)=>b[1].n-a[1].n),lim=showAll?fl.length:40;
 const sec=(t,rows)=>rows.length?`<div class="card"><div class="lb">${t}</div>${rows.join('')}</div>`:'';
 const ref=i=>`<a href="#t${i+1}" data-open="${i}">Task ${i+1}</a>`;
 const cm=[],dp=[],ln=[];DATA.forEach((d,i)=>{d.cm.forEach(c=>cm.push(`<div class="fd">${esc(c)} <span class="small mute">· ${ref(i)}</span></div>`));d.dp.forEach(c=>dp.push(`<div class="fd">${esc(c)} <span class="small mute">· ${ref(i)}</span></div>`));d.ln.forEach(l=>ln.push(`<div class="fd"><a href="https://claude.ai/artifact/${esc(l)}">artifact ${esc(l.slice(0,6))}</a> <span class="small mute">· ${ref(i)}</span></div>`))});
 $('v-chg').innerHTML=(fl.length?`<div class="card"><div class="lb">${fl.length} file${fl.length==1?'':'s'} changed</div><table><tr><th>File</th><th class="num">Edits</th><th>Tasks</th></tr>${fl.slice(0,lim).map(([k,o])=>`<tr><td style="overflow-wrap:anywhere">${esc(k)}</td><td class="num">${o.n}</td><td>${o.t.slice(-4).map(ref).join(', ')}${o.t.length>4?' +'+(o.t.length-4):''}</td></tr>`).join('')}</table>${fl.length>40?`<button id="sa" style="margin-top:8px">${showAll?'Show fewer':'Show all '+fl.length}</button>`:''}</div>`:'')+sec('Commits',cm)+sec('Deployed',dp)+sec('Published',ln)||'<p class="mute">Nothing was changed.</p>';
 const sa=$('sa');if(sa)sa.onclick=()=>{showAll=!showAll;chg()}}

function need(){const w=DATA.map((d,i)=>i).filter(i=>DATA[i].ask).reverse();
 $('v-need').innerHTML=w.length?`<h2>${w.length} task${w.length==1?'':'s'} wait${w.length==1?'s':''} on you</h2>`+w.map(i=>`<div class="need"><div class="t">Task ${i+1} · ${dt(DATA[i].t)}</div><div style="margin-bottom:6px">${esc(DATA[i].ask)}</div><div>${DATA[i].op.map(o=>`<span class="cp">${esc(o)}</span>`).join('')}</div><button data-open="${i}">Open task</button></div>`).join(''):'<div class="card"><b>Nothing waits on you.</b><div class="mute">Every question was answered or no question was asked.</div></div>'}

function steps(st){const d=DATA[cur];if(!d.st.length){$('steps').innerHTML='<div class="small mute">No plan was kept for this task, so there are no steps to show.</div>';$('bar').style.width='0';$('pct').textContent='';return}
 $('steps').innerHTML=d.st.map((s,i)=>{const k=st[i],bg=k=='c'?'var(--goodbg)':'var(--soft)',c=k=='c'?'var(--good)':k=='i'?'var(--info)':'var(--mute)';return `<div class="step" style="color:${k=='p'?'var(--mute)':'var(--fg)'}"><span class="dot" style="background:${bg};color:${c}">${k=='c'?'✓':k=='i'?'…':'·'}</span>${esc(s[0])}</div>`}).join('');
 const n=st.filter(x=>x=='c').length;$('bar').style.width=(n/st.length*100)+'%';$('pct').textContent=n+' of '+st.length+' done'}
function detail(reveal){const d=DATA[cur];
 $('when').textContent='Task '+(cur+1)+' of '+N+' · '+dt(d.t)+' · '+fm(Math.max(0,d.e-d.t));$('title').textContent=d.ti;$('raw').textContent='You said: "'+d.g+'"';
 $('finds').innerHTML=d.fi.map(f=>`<div class="fd">${esc(f.x)}<div class="small mute">${dt(f.t)}</div></div>`).join('')||'<div class="small mute">No result was written down for this task.</div>';
 $('decs').innerHTML=d.de.map(x=>`<div style="margin-bottom:10px"><div style="margin-bottom:6px">${esc(x.q)}</div><div>${x.o.map(o=>`<span class="cp ${x.a&&x.a.toLowerCase()==o.toLowerCase()?'pick':''}">${esc(o)}</span>`).join('')}</div><div class="small mute">${x.a?'Your answer: "'+esc(x.a)+'"':'No answer recorded.'}</div></div>`).join('')||'<div class="small mute">No decisions were needed.</div>';
 const fl=Object.entries(d.fl),o=[];if(fl.length)o.push(['Files',fl.map(([k,v])=>`<span class="cp">${esc(k)}${v>1?' ×'+v:''}</span>`).join('')+(d.nfl>fl.length?`<span class="cp">+${d.nfl-fl.length} more</span>`:'')]);
 if(d.cm.length)o.push(['Commits',d.cm.map(c=>`<span class="cp">${esc(c)}</span>`).join('')]);if(d.dp.length)o.push(['Deployed',d.dp.map(c=>`<span class="cp">${esc(c)}</span>`).join('')]);
 if(d.ln.length)o.push(['Published',d.ln.map(l=>`<a class="cp" href="https://claude.ai/artifact/${esc(l)}">artifact ${esc(l.slice(0,6))}</a>`).join('')]);
 $('outs').innerHTML=o.map(x=>`<div style="margin-bottom:4px"><span class="small mute">${x[0]}</span><div>${x[1]}</div></div>`).join('')||'<div class="small mute">Nothing was changed. This task only looked or answered.</div>';
 $('need').hidden=!d.ask;$('ask').textContent=d.ask;$('opts').innerHTML=d.op.map(x=>`<span class="cp">${esc(x)}</span>`).join('');
 if(!reveal){steps(d.st.map(s=>s[1]));[1,2,3,4].forEach(i=>sec('s'+i,true))}}
const sec=(id,on)=>{$(id).style.opacity=on?1:.12};
function open(i){if(i<0||i>=N)return;stopRp();cur=i;if(!$('dr').classList.contains('open'))opener=document.activeElement;
 $('dr').classList.add('open');$('ov').classList.add('open');$('dr').setAttribute('aria-hidden','false');$('main').inert=true;detail(false);$('db').scrollTop=0;
 try{history.replaceState(null,'','#t'+(i+1))}catch(e){}if(view=='tasks'||view=='over')refresh();$('x').focus()}
function close(){stopRp();$('dr').classList.remove('open');$('ov').classList.remove('open');$('dr').setAttribute('aria-hidden','true');$('main').inert=false;
 try{history.replaceState(null,'','#'+view)}catch(e){}if(opener&&opener.isConnected)opener.focus();cur=-1;refresh()}
function refresh(){if(view=='tasks')tasks();else if(view=='over')over()}
function nextI(i,dir){for(let k=i;k>=0&&k<N;k+=dir)if(vis(k))return k;return -1}
function step(dir){const k=nextI(cur+dir,dir);if(k>=0)open(k)}
function stopRp(){rp=false;clearTimeout(timer);$('rp').textContent='Replay'}
function play(i){i=nextI(i,1);if(i<0){stopRp();return}
 cur=i;$('dr').classList.add('open');$('ov').classList.add('open');$('main').inert=true;detail(true);if(view=='tasks'||view=='over')refresh();const d=DATA[i];[1,2,3,4].forEach(k=>sec('s'+k,false));const n=d.st.length;let k=0;steps(d.st.map(()=>'p'));sec('s1',true);
 const reveal=s=>{if(!rp)return;if(s>4){timer=setTimeout(()=>play(i+1),700);return}sec('s'+s,true);timer=setTimeout(()=>reveal(s+1),450)};
 const tick=()=>{if(!rp)return;if(k<n){steps(d.st.map((s,j)=>j<k?d.st[j][1]:j==k?'i':'p'));k++;timer=setTimeout(tick,380)}else{steps(d.st.map(s=>s[1]));reveal(2)}};tick()}
function taskText(i){const d=DATA[i];return ['Task '+(i+1)+': '+d.ti+' ('+dt(d.t)+')','You said: "'+d.g+'"',d.st.length?'Steps: '+d.st.map(s=>(s[1]=='c'?'[x] ':'[ ] ')+s[0]).join('; '):'','Found: '+d.fi.map(f=>f.x).join(' '),d.de.length?'Decisions: '+d.de.map(y=>y.q+' -> '+(y.a||'no answer')).join('; '):'',d.nfl?'Files: '+Object.keys(d.fl).join(', '):'',d.cm.length?'Commits: '+d.cm.join('; '):'',d.dp.length?'Deployed: '+d.dp.join('; '):'',d.ask?'Needs you: '+d.ask:''].filter(Boolean).join('\n')}
function report(){const s=stat();return ['# '+META.name,'','Goal: '+(META.goal||(DATA[0]&&DATA[0].g)||''),'',...(META.paras||[]),'',s.dn+' of '+s.all.length+' steps done. '+s.dec+' decisions. '+s.files+' files changed. '+s.w+' waiting on you.','','## Tasks',...DATA.map((d,i)=>(i+1)+'. '+d.ti+' - '+LAB[status(d)]+' ('+dt(d.t)+')')].join('\n')}

document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){e.preventDefault();open(+o.dataset.open);return}
 const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab,t.dataset.flt);return}
 const f=e.target.closest('#filters [data-flt]');if(f){flt=f.dataset.flt;tasks()}});
$('x').onclick=close;$('ov').onclick=close;$('pv').onclick=()=>step(-1);$('nx').onclick=()=>step(1);
$('dc').onclick=()=>copy(taskText(cur));$('dl').onclick=()=>{let u=location.href.split('#')[0]+'#t'+(cur+1);copy(u)};
$('cp').onclick=()=>copy(report());
$('lv').onclick=()=>{lm=!lm;tasks()};
$('q').oninput=e=>{qs=e.target.value.toLowerCase().trim();tasks()};
$('rp').onclick=()=>{if(rp){stopRp();return}rp=true;$('rp').textContent='Stop';play(0)};
$('hb').onclick=()=>{const h=$('help');h.hidden=!h.hidden;$('hb').setAttribute('aria-expanded',!h.hidden)};
$('theme').onclick=()=>{const r=document.documentElement,dark=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',e=>{const open_=$('dr').classList.contains('open');
 if(e.key=='Escape'){if(!$('help').hidden){$('hb').click();return}if(open_)close();return}
 if(e.key=='Tab'&&open_){const f=[...$('dr').querySelectorAll('button,a[href]')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement==a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement==z){e.preventDefault();a.focus()}return}
 if(e.target.tagName=='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key>='1'&&e.key<='5'){close();go(TABS[+e.key-1][0])}
 else if(e.key=='/'){e.preventDefault();close();go('tasks');$('q').focus()}
 else if(e.key=='j'||e.key=='ArrowRight'){if(open_)step(1)}
 else if(e.key=='k'||e.key=='ArrowLeft'){if(open_)step(-1)}
 else if(e.key=='r')$('rp').click();
 else if(e.key=='?')$('hb').click()});
$('h1').textContent=META.name;
if(N){$('sub').textContent=N+' tasks · '+dt(DATA[0].t)+' to '+dt(DATA[N-1].e);$('cov').textContent=META.note;
 const h=(location.hash||'').slice(1),m=/^t(\d+)$/.exec(h);go(TABS.some(t=>t[0]==h)?h:'over');if(m&&+m[1]>=1&&+m[1]<=N)open(+m[1]-1)}
else{$('sub').textContent='No tasks with work were found in this session.';$('tabs').hidden=true}
</script>
