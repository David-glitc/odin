<style>

.sec{transition:opacity .5s;margin-bottom:20px}
.tl{position:relative;padding-left:26px}.tl:before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tn{position:relative;margin-bottom:12px}.tn:before{content:"";position:absolute;left:-23px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.tn.q:before{background:var(--blk-wait)}

td.num{width:150px;font:12px var(--mono);color:var(--mute)}.eb{display:inline-block;height:6px;border-radius:3px;background:var(--gold);vertical-align:middle;margin-right:8px;min-width:4px;opacity:.85}
.ring{flex:none;width:44px;height:44px}.ring circle{fill:none;stroke-width:4}

#dh{padding:12px 16px;border-bottom:1px solid var(--line);flex:none}

textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}select{width:auto}textarea{resize:vertical;margin-bottom:8px}
button.cp{border:1px solid var(--line);cursor:pointer}button.cp:hover{border-color:var(--gold)}
.live{border-color:var(--gold)}
.tr{margin:0 0 6px;padding-left:18px;position:relative;color:var(--fg);line-height:1.5}.tr:before{content:'';position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--line)}.tr.d:before{background:var(--gold);border-radius:1px;transform:rotate(45deg)}.tr.d{font-weight:500}.sn{display:block;font-size:12px;color:var(--mute);font-style:italic;margin-top:2px}.live .goal{margin-bottom:12px}
[data-motif=grid] .hero:after{border:0;border-radius:0;box-shadow:none;width:300px;height:220px;right:0;top:0;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px;-webkit-mask-image:linear-gradient(to left,#000,transparent);mask-image:linear-gradient(to left,#000,transparent)}
[data-motif=dots] .hero:after{border:0;border-radius:0;box-shadow:none;width:300px;height:220px;right:0;top:0;background:radial-gradient(var(--line) 1.6px,transparent 1.8px) 0 0/16px 16px;-webkit-mask-image:linear-gradient(to left,#000,transparent);mask-image:linear-gradient(to left,#000,transparent)}
[data-motif=none] .hero:after{display:none}
[data-density=compact] body{font-size:13px}[data-density=compact] .card{padding:12px 14px;margin-bottom:10px}[data-density=compact] .hero{padding:18px 20px 14px}[data-density=compact] .goal{font-size:clamp(18px,3vw,24px);margin-bottom:12px}[data-density=compact] .chips{gap:8px;margin-bottom:10px}[data-density=compact] .chip{padding:8px 10px}[data-density=compact] .day{padding:3px 0}[data-density=compact] .item{padding:7px 6px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;opacity:0;transition:.2s;z-index:30;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#help{position:absolute;right:0;top:40px;z-index:6;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
#help[hidden]{display:none}#help div{display:flex;justify-content:space-between;margin:4px 0}kbd{background:var(--soft);border-radius:5px;padding:0 6px;font:12px var(--mono)}
</style>
<div id="main">
<header>
<div class="row sp"><div class="brand"><svg class="eye" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M5 32Q32 9 59 32Q32 55 5 32Z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="9" fill="currentColor"/></svg><h1 id="h1"></h1></div>

<script>
const META=/*META*/{"name":"Work","base":0,"total":0,"note":""},DATA=/*DATA*/[];
const $=id=>document.getElementById(id),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],N=DATA.length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={goal:'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.4"/>',steps:'<path d="M2.5 4l1.4 1.4L6.5 3M2.5 9l1.4 1.4L6.5 8M9 4.5h4.5M9 9.5h4.5M2.5 13.5h11"/>',find:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',dec:'<path d="M2 8h4l3-4.5h5M6 8l3 4.5h5"/>',file:'<path d="M4 1.8h5l3 3V14H4z"/><path d="M9 1.8v3h3"/>',ship:'<path d="M8 13V3M4 7l4-4 4 4"/>',wait:'<circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.5"/>',task:'<rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M5.5 8h5"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${P[k]}</svg>`;
const U=m=>new Date(META.base+m*60000),dt=m=>{const x=U(m);return x.getUTCDate()+' '+MO[x.getUTCMonth()]+' '+String(x.getUTCHours()).padStart(2,'0')+':'+String(x.getUTCMinutes()).padStart(2,'0')+' UTC'};
const fm=m=>m<1?'under 1 min':m<60?Math.round(m)+' min':m<2880?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' days';
const status=d=>d.ask?'wait':(d.st.length&&d.st.some(s=>s[1]!='c'))?'open':'done';
const CV={done:'--blk-done',wait:'--blk-wait',open:'--blk-open'},LAB={done:'Finished',wait:'Waiting on you',open:'Plan unfinished'};
const frac=d=>d.st.length?d.st.filter(s=>s[1]=='c').length/d.st.length:1;
const fillBg=d=>{const c=`var(${CV[status(d)]})`,p=Math.round(frac(d)*100);return p>=100?c:`linear-gradient(to top,${c} ${p}%,color-mix(in srgb,${c} 20%,var(--soft)) ${p}%)`};
const shipped=d=>d.dp.length+d.cm.length+d.ln.length;
let cur=-1,view='over',flt='all',qs='',lm=false,rp=false,timer=null,opener=null,showAll=false;
const F={all:['All',()=>true],wait:['Waiting on you',d=>!!d.ask],dec:['Decisions',d=>d.de.length>0],dep:['Shipped',d=>shipped(d)>0],fil:['Files changed',d=>d.nfl>0],open:['Plan unfinished',d=>status(d)=='open']};

function play(i){i=nextI(i,1);if(i<0){stopRp();return}
 cur=i;$('dr').classList.add('open');$('ov').classList.add('open');$('main').inert=true;detail(true);if(view=='tasks'||view=='over')refresh();const d=DATA[i];[1,2,3,4,5].forEach(k=>sec('s'+k,false));const n=d.st.length;let k=0;steps(d.st.map(()=>'p'));sec('s1',true);
 const ORD=[5,2,3,4],reveal=j=>{if(!rp)return;if(j>=ORD.length){timer=setTimeout(()=>play(i+1),700);return}sec('s'+ORD[j],true);timer=setTimeout(()=>reveal(j+1),450)};
 const tick=()=>{if(!rp)return;if(k<n){steps(d.st.map((s,j)=>j<k?d.st[j][1]:j==k?'i':'p'));k++;timer=setTimeout(tick,380)}else{steps(d.st.map(s=>s[1]));reveal(0)}};tick()}
function taskText(i){const d=DATA[i];return ['Task '+(i+1)+': '+d.ti+' ('+dt(d.t)+')','You said: "'+d.g+'"',d.st.length?'Steps: '+d.st.map(s=>(s[1]=='c'?'[x] ':'[ ] ')+s[0]).join('; '):'','Found: '+d.fi.map(f=>f.x).join(' '),d.de.length?'Decisions: '+d.de.map(y=>y.q+' -> '+(y.a||'no answer')).join('; '):'',d.nfl?'Files: '+Object.keys(d.fl).join(', '):'',d.cm.length?'Commits: '+d.cm.join('; '):'',d.dp.length?'Deployed: '+d.dp.join('; '):'',d.ask?'Needs you: '+d.ask:''].filter(Boolean).join('\n')}
function report(){const s=stat();return ['# '+META.name,'','Goal: '+(META.goal||(DATA[0]&&DATA[0].g)||''),'',...(META.paras||[]),'',s.dn+' of '+s.all.length+' steps done. '+s.dec+' decisions. '+s.files+' files changed. '+s.w+' waiting on you.','','## Tasks',...DATA.map((d,i)=>(i+1)+'. '+d.ti+' - '+LAB[status(d)]+' ('+dt(d.t)+')')].join('\n')}

document.addEventListener('click',async e=>{const an=e.target.closest('[data-ans]');if(an){if(await sendIn({kind:'answer',task:+an.dataset.ans+1,text:an.dataset.opt}))an.classList.add('pick');return}
 const ac=e.target.closest('[data-act]');if(ac){await sendIn({kind:ac.dataset.act,text:ac.dataset.lab,task:cur+1});return}
 if(e.target.id=='pz'){const st=pauseState();await sendIn({kind:st=='pause'?'resume':'pause',text:st=='pause'?'Resume run':'Pause run',task:0});return}
 if(e.target.id=='dm'&&CM){CM.openComposer({element:$('title')}).catch(()=>toast('Comments are not available'));return}
 const o=e.target.closest('[data-open]');if(o){e.preventDefault();open(+o.dataset.open);return}
 const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab,t.dataset.flt);return}
 const f=e.target.closest('#filters [data-flt]');if(f){flt=f.dataset.flt;tasks()}});
$('x').onclick=close;$('ov').onclick=close;$('pv').onclick=()=>step(-1);$('nx').onclick=()=>step(1);
$('dc').onclick=()=>copy(taskText(cur));$('dl').onclick=()=>{copy(location.href.split('#')[0]+'#t'+(cur+1))};
$('cp').onclick=()=>copy(report());
$('lv').onclick=()=>{lm=!lm;tasks()};
$('q').oninput=e=>{qs=e.target.value.toLowerCase().trim();tasks()};
$('rp').onclick=()=>{if(rp){stopRp();return}rp=true;$('rp').textContent='Stop';play(0)};
$('hb').onclick=()=>{const h=$('help');h.hidden=!h.hidden;$('hb').setAttribute('aria-expanded',!h.hidden)};
$('theme').onclick=()=>{const r=document.documentElement,dark=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',e=>{const open_=$('dr').classList.contains('open');
 if(e.key=='Escape'){if(!$('help').hidden){$('hb').click();return}if(open_)close();return}
 if(e.key=='Tab'&&open_){const f=[...$('dr').querySelectorAll('button,a[href]')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement==a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement==z){e.preventDefault();a.focus()}return}
 if(e.target.tagName=='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key>='1'&&+e.key<=TABS.length){close();go(TABS[+e.key-1][0])}
 else if(e.key=='/'){e.preventDefault();close();go('tasks');$('q').focus()}
 else if(e.key=='j'||e.key=='ArrowRight'){if(open_)step(1)}
 else if(e.key=='k'||e.key=='ArrowLeft'){if(open_)step(-1)}
 else if(e.key=='r')$('rp').click();
 else if(e.key=='?')$('hb').click()});
applyStyle(META.style);$('h1').textContent=META.name;
if(N){$('sub').textContent=N+' tasks · '+dt(DATA[0].t)+' to '+dt(DATA[N-1].e);$('cov').textContent=META.note;
 const h=(location.hash||'').slice(1),m=/^t(\d+)$/.exec(h);go(TABS.some(t=>t[0]==h)?h:'over');if(m&&+m[1]>=1&&+m[1]<=N)open(+m[1]-1)}
else{$('sub').textContent='No tasks with work were found in this session.';$('tabs').hidden=true}
startLive();
</script>
