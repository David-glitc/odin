,"auth.ts":1},"nfl":2,"cm":[],"dp":[],"ln":[],"ask":"","op":[],"tr":[]},{"t":7,"e":9,"g":"ok ship it to staging","ti":"The 61st request in a minute returns 429, as planned","st":[["Run the test suite","c"],["Deploy to staging","c"],["Check the live limit","c"]],"fi":[{"t":9,"x":"Staging is live. The 61st request in a minute returns 429, as planned."}],"de":[],"fl":{},"nfl":0,"cm":[],"dp":["Deploy to staging"],"ln":[],"ask":"Deploy to production?","op":["Yes, deploy","Not yet"],"tr":[]}];
const $=id=>document.getElementById(id),MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],N=DATA.length;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={goal:'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="2.4"/>',steps:'<path d="M2.5 4l1.4 1.4L6.5 3M2.5 9l1.4 1.4L6.5 8M9 4.5h4.5M9 9.5h4.5M2.5 13.5h11"/>',find:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',dec:'<path d="M2 8h4l3-4.5h5M6 8l3 4.5h5"/>',file:'<path d="M4 1.8h5l3 3V14H4z"/><path d="M9 1.8v3h3"/>',ship:'<path d="M8 13V3M4 7l4-4 4 4"/>',wait:'<circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.5"/>',task:'<rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M5.5 8h5"/>'};
const ic=k=>`<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">${P[k]}</svg>`;
const U=m=>new Date(META.base+m*60000),dt=m=>{const x=U(m);return x.getUTCDate()+' '+MO[x.getUTCMonth()]+' '+String(x.getUTCHours()).padStart(2,'0')+':'+String(x.getUTCMinutes()).padStart(2,'0')+' UTC'};
const fm=m=>m<1?'under 1 min':m<60?Math.round(m)+' min':m<2880?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' days';
const status=d=>d.ask?'wait':(d.st.length&&d.st.some(s=>s[1]!='c'))?'open':'done';
const CV={done:'--blk-done',wait:'--blk-wait',open:'--blk-open'},LAB={done:'Finished',wait:'Waiting on you',open:'Plan unfinished'};
const frac=d=>d.st.length?d.st.filter(s=>s[1]=='c').length/d.st.length:1;
const fillBg=d=>{const c=`var(${CV[status(d)]})`,p=Math.round(frac(d)*100);return p>=100?c:`linear-gradient(to top,${c} ${p}%,color-mix(in srgb,${c} 20%,var(--soft)) ${p}%)`};
const shipped=d=>d.dp.length+d.cm.length+d.ln.length;
let cur=-1,view='over',flt='all',qs='',lm=false,rp=false,timer=null,opener=null,showAll=false;
const F={all:['All',()=>true],wait:['Waiting on you',d=>!!d.ask],dec:['Decisions',d=>d.de.length>0],dep:['Shipped',d=>shipped(d)>0],fil:['Files changed',d=>d.nfl>0],open:['Plan unfinished',d=>status(d)=='open']};
const vis=i=>{const d=DATA[i];return F[flt][1](d)&&(!qs||(d.ti+' '+d.g+' '+d.fi.map(f=>f.x).join(' ')).toLowerCase().includes(qs))};
const fn=s=>esc(s).replace(/\[(\d+)\]/g,(m,n)=>+n>=1&&+n<=N?`<sup><a href="#t${n}" data-open="${n-1}" aria-label="Task ${n}">${n}</a></sup>`:m);
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),1600)};
const copy=async s=>{try{await navigator.clipboard.writeText(s);toast('Copied');return}catch(e){}try{const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copied')}catch(e){toast('Copy is blocked here')}};
const stat=()=>{const all=DATA.flatMap(x=>x.st),dn=all.filter(x=>x[1]=='c').length;return {all,dn,w:DATA.filter(d=>d.ask).length,dec:DATA.reduce((a,x)=>a+x.de.length,0),fi:DATA.reduce((a,x)=>a+x.fi.length,0),files:new Set(DATA.flatMap(x=>Object.keys(x.fl))).size,sh:DATA.reduce((a,x)=>a+shipped(x),0)}};
let TABS=[['over','Overview'],['tasks','Tasks'],['decs','Decisions'],['chg','Changes'],['need','Needs you']];
let DB=null,CM=null,CAN=false,LIVE=null,INB=[];
/* Look chosen by the agent. Only these values are accepted, all pre-checked for WCAG AA contrast. */
const PAL={gold:['#8a6420','#d9b36c'],ember:['#b5451f','#ff8a5c'],ocean:['#1f6f93','#6fc3e8'],forest:['#2a7048','#6fcf97'],violet:['#6342c4','#a99bff'],ink:['#1d1b16','#ece8dc']};

let STY={};
function applyStyle(st){st=st||{};const k=PAL[st.palette]?st.palette:'gold',pal=PAL[k];
 STY={palette:k,font:FONTS[st.font]?st.font:'serif',motif:MOTIF.includes(st.motif)?st.motif:'ring',density:DENS.includes(st.density)?st.density:'airy',order:Array.isArray(st.order)&&st.order.length?st.order.filter(b=>BLOCKS.includes(b)):BLOCKS.slice(),why:typeof st.why=='string'?st.why.slice(0,160):''};
 const v=g=>`--gold:${g};--goldbg:color-mix(in srgb,var(--gold) 16%,var(--panel));--glow:color-mix(in srgb,var(--gold) 12%,transparent);`;
 let el=document.getElementById('stl');if(!el){el=document.createElement('style');el.id='stl';document.head.appendChild(el)}
 el.textContent=`:root{${v(pal[0])}--serif:${FONTS[STY.font]}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${v(pal[1])}}}:root[data-theme="dark"]{${v(pal[1])}}:root[data-theme="light"]{${v(pal[0])}}`;
 document.documentElement.dataset.density=STY.density;document.documentElement.dataset.motif=STY.motif;
 const w=$('lookwhy');if(w)w.textContent=STY.why?'Look chosen by the agent: '+STY.why:''}
const optChip=(i,o)=>CAN?`<button class="cp" data-ans="${i}" data-opt="${esc(o)}" title="Send this answer to the agent">${esc(o)}</button>`:`<span class="cp">${esc(o)}</span>`;
const stag=el=>{el.classList.add('rise');[...el.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,10)))};

function tabs(){const s=stat();$('tabs').innerHTML=TABS.map(t=>{const b=t[0]=='tasks'?N:t[0]=='decs'?s.dec:t[0]=='need'?s.w:0;return `<button role="tab" aria-selected="${t[0]==view}" class="${t[0]==view?'on':''}" data-tab="${t[0]}">${t[1]}${b?`<span class="badge ${t[0]=='need'?'w':''}">${b}</span>`:''}</button>`}).join('')}
function go(v,f){view=v;if(f)flt=f;tabs();TABS.forEach(t=>$('v-'+t[0]).hidden=t[0]!=v);({over,tasks,decs,chg,need})[v]();stag($('v-'+v));try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo({top:0})}

function over(){const s=stat(),refs=[];(META.paras||[]).forEach(p=>p.replace(/\[(\d+)\]/g,(m,n)=>{n=+n;if(n>=1&&n<=N&&!refs.includes(n))refs.push(n)}));
 const ch=[['goal','Tasks',N+(META.total>N?' of '+META.total:''),'tasks','all','--gold'],['steps','Steps done',s.dn+' of '+s.all.length,'tasks','open','--blk-open'],['find','Findings',s.fi,'tasks','all','--info'],['dec','Decisions',s.dec,'decs','','--gold'],['file','Files changed',s.files,'chg','','--good'],['ship','Shipped',s.sh,'chg','','--good'],['wait','Waiting on you',s.w,'need','','--blk-wait']];
 const SP=[cum(()=>1),cum(d=>d.st.filter(x=>x[1]=='c').length),cum(d=>d.fi.length),cum(d=>d.de.length),cum(d=>d.nfl),cum(shipped),null];
 const w=DATA.map((d,i)=>i).filter(i=>DATA[i].ask),mins=DATA.map(d=>Math.max(1,d.e-d.t));
 const B={};
 B.live=`<div id="live">${liveHtml()}</div>`;
 B.hero=`<div class="card hero"><div class="lb">${ic('goal')}Goal</div><div class="goal">${esc(META.goal||(DATA[0]&&DATA[0].g)||'')}</div>
 <div class="lb">${ic('find')}Summary</div>${(META.paras||[]).map(p=>`<p>${fn(p)}</p>`).join('')||'<p class="mute">No summary was written. Open a task to see what it did.</p>'}
 ${refs.length?`<div class="lb" style="margin-top:16px">${ic('file')}Notes</div><ol class="fnl">${refs.map(n=>`<li><sup><a href="#t${n}" data-open="${n-1}">${n}</a></sup> <a href="#t${n}" data-open="${n-1}">${esc(DATA[n-1].ti)}</a> · ${dt(DATA[n-1].t)}</li>`).join('')}</ol>`:''}</div>`;
 B.chips=`<div class="chips">${ch.map((c,ci)=>`<button class="chip" style="--c:var(${c[5]})" data-tab="${c[3]}" ${c[4]?`data-flt="${c[4]}"`:''}><i>${ic(c[0])}</i><div><b>${c[2]}</b><span>${c[1]}</span></div>${SP[ci]&&SP[ci].length>1?sparkSvg(SP[ci],`var(${c[5]})`):''}</button>`).join('')}</div>`;
 B.charts=chartsHtml();
 B.needs=`${w.length?`<div class="need"><div class="t"><i class="pulse"></i>Needs you</div>${w.slice(-3).map(i=>`<div style="margin-bottom:6px">${esc(DATA[i].ask)} <sup><a href="#t${i+1}" data-open="${i}">${i+1}</a></sup></div>`).join('')}<button data-tab="need">See all ${w.length}</button></div>`:''}`;
 B.why=`${(()=>{const L=[];DATA.forEach((d,i)=>d.tr.filter(x=>x[1]=='d').forEach(x=>L.push([i,x[0]])));const T=L.slice(-6).reverse();return T.length?`<div class="card"><div class="lb">${ic('dec')}Why it went this way</div>${T.map(([i,x])=>`<div class="tr d">${esc(x)} <sup><a href="#t${i+1}" data-open="${i}">${i+1}</a></sup></div>`).join('')}<div class="small mute">Decision-like notes the agent wrote while it worked, newest first.</div></div>`:''})()}`;
 B.strip=`<div class="card"><div class="lb">${ic('task')}The run, task by task</div><div class="strip">${DATA.map((d,i)=>`<button class="seg ${i==cur?'sel':''}" data-open="${i}" style="flex-grow:${Math.sqrt(mins[i]).toFixed(2)};background:${fillBg(d)}" aria-label="Task ${i+1}: ${esc(d.ti)}" title="${i+1}. ${esc(d.ti)}"></button>`).join('')}</div><div class="axis"><span>${dt(DATA[0].t)}</span><span>segment width = time spent, shortened</span><span>${dt(DATA[N-1].e)}</span></div></div>`;
 const ord=STY.order.includes('hero')?STY.order:['hero',...STY.order];
 $('v-over').innerHTML=ord.map(k=>B[k]||'').join('')}

/* ---- charts: plain SVG, one axis, thin marks, selective labels, hover tips, table view ---- */
const DAY=m=>{const x=U(m);return Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate())/864e5|0};
const dlab=k=>{const x=new Date(k*864e5);return x.getUTCDate()+' '+MO[x.getUTCMonth()]};
function perDay(f){const m=new Map();DATA.forEach(d=>{const k=DAY(d.t);m.set(k,(m.get(k)||0)+f(d))});const ks=[...m.keys()],b=Math.max(...ks),a=Math.max(Math.min(...ks),b-59),r=[];for(let k=a;k<=b;k++)r.push({k,l:dlab(k),v:m.get(k)||0});return r}
function barsSvg(rows,unit,col,h){h=h||120;const W=420,L=28,B=18,T=8,n=rows.length,mx=Math.max(1,...rows.map(r=>r.v)),pw=W-L-4,step=pw/n,bw=Math.max(2,Math.min(22,step-2)),ph=h-T-B;let g='';
 [0,.5,1].forEach(t=>{const y=T+ph*(1-t);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" ${t?'stroke-dasharray="2 3"':''}/><text x="${L-5}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--mute)">${Math.round(mx*t)}</text>`});
 rows.forEach((r,i)=>{const x=L+i*step+(step-bw)/2,bh=ph*r.v/mx,y=T+ph-bh,rd=Math.min(4,bw/2,bh),tip=esc(r.l)+': '+r.v+' '+unit;
  if(r.v>0)g+=`<path class="mk" d="M${x.toFixed(1)} ${(y+bh).toFixed(1)}V${(y+rd).toFixed(1)}Q${x.toFixed(1)} ${y.toFixed(1)} ${(x+rd).toFixed(1)} ${y.toFixed(1)}H${(x+bw-rd).toFixed(1)}Q${(x+bw).toFixed(1)} ${y.toFixed(1)} ${(x+bw).toFixed(1)} ${(y+rd).toFixed(1)}V${(y+bh).toFixed(1)}Z" fill="${col}" data-tip="${tip}" tabindex="0"/>`;
  else g+=`<rect x="${x.toFixed(1)}" y="${T+ph-1.5}" width="${bw}" height="1.5" fill="var(--line)" data-tip="${tip}"/>`});
 [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)==i).forEach(i=>{g+=`<text x="${(L+i*step+step/2).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--mute)">${esc(rows[i].l)}</text>`});
 return `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(unit)} per day, ${rows.length} days">${g}</svg>`}
function hbarsSvg(rows,unit,col){const W=420,L=84,R=44,rh=24,mx=Math.max(1,...rows.map(r=>r.v));
 return `<svg viewBox="0 0 ${W} ${rows.length*rh+4}" role="img" aria-label="${esc(unit)} by group">${rows.map((r,i)=>{const y=i*rh+2,w=Math.max(3,(W-L-R)*r.v/mx);return `<text x="${L-8}" y="${y+15}" text-anchor="end" font-size="11" fill="var(--fg)">${esc(r.l)}</text><rect class="mk" x="${L}" y="${y+4}" width="${w.toFixed(1)}" height="12" rx="3" fill="${col}" data-tip="${esc(r.l)}: ${r.v} ${unit}" tabindex="0"/><text x="${(L+w+6).toFixed(1)}" y="${y+15}" font-size="11" fill="var(--mute)">${r.v}</text>`}).join('')}</svg>`}
function ringSvg(f,big,sub){const r=40,c=2*Math.PI*r;return `<svg viewBox="0 0 110 110" style="width:110px;flex:none" role="img" aria-label="${esc(big+' '+sub)}"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--soft)" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--blk-done)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(f*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 55 55)"/><text x="55" y="56" text-anchor="middle" font-size="22" font-family="var(--serif)" fill="var(--fg)">${esc(big)}</text><text x="55" y="71" text-anchor="middle" font-size="9" fill="var(--mute)">${esc(sub)}</text></svg>`}
function stackHtml(parts){return `<div class="stk">${parts.filter(p=>p.v).map(p=>`<i style="flex:${p.v};background:${p.c}" data-tip="${esc(p.l)}: ${p.v}" tabindex="0"></i>`).join('')}</div><div class="leg">${parts.map(p=>`<span><b style="background:${p.c}"></b>${esc(p.l)} ${p.v}</span>`).join('')}</div>`}
function heatSvg(rows){const C=20,G=4,dow=(new Date(rows[0].k*864e5).getUTCDay()+6)%7,wk=Math.ceil((rows.length+dow)/7),mx=Math.max(1,...rows.map(r=>r.v));
 const cells=rows.map((r,i)=>{const j=i+dow,x=Math.floor(j/7)*(C+G)+28,y=(j%7)*(C+G)+4,lv=r.v?Math.ceil(4*r.v/mx):0;return `<rect x="${x}" y="${y}" width="${C}" height="${C}" rx="3" fill="${lv?`color-mix(in srgb,var(--gold) ${15+lv*21}%,var(--soft))`:'var(--soft)'}" data-tip="${esc(r.l)}: ${r.v} task${r.v==1?'':'s'}" tabindex="0"/>`}).join('');
 const lab=['Mon','Wed','Fri'].map((t,i)=>`<text x="0" y="${i*2*(C+G)+4+C-5}" font-size="10" fill="var(--mute)">${t}</text>`).join('');
 return `<svg class="hm" viewBox="0 0 ${wk*(C+G)+30} ${7*(C+G)+8}" style="width:${wk*(C+G)+30}px;max-width:none" role="img" aria-label="Tasks per day calendar">${lab}${cells}</svg>`}
function sparkSvg(vals,col){const W=54,H=22,mx=Math.max(1,...vals),n=Math.max(1,vals.length-1),pts=vals.map((v,i)=>[(i/n*W).toFixed(1),(H-2-(H-4)*v/mx).toFixed(1)]);return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M0 ${H} L${pts.map(p=>p.join(' ')).join(' L')} L${W} ${H}Z" fill="${col}" opacity=".16"/><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
const cum=f=>{let a=0;const v=DATA.map(d=>a+=f(d));const k=Math.ceil(v.length/24);return v.length>24?v.filter((x,i)=>i%k==0||i==v.length-1):v};
const tbl=rows=>`<details class="tv"><summary>Table view</summary><table>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td></tr>`).join('')}</table></details>`;
const fileTypes=()=>{const e={};DATA.forEach(d=>Object.entries(d.fl).forEach(([k,v])=>{const m=/\.([a-z0-9]+)$/i.exec(k),x=m?'.'+m[1].toLowerCase():'other';e[x]=(e[x]||0)+v}));let r=Object.entries(e).sort((a,b)=>b[1]-a[1]);if(r.length>7){const o=r.slice(6).reduce((a,x)=>a+x[1],0);r=r.slice(0,6).concat([['other',o]])}return r.map(([l,v])=>({l,v}))};
function chartsHtml(){const s=stat(),f=s.all.length?s.dn/s.all.length:1,st={done:0,wait:0,open:0};DATA.forEach(d=>st[status(d)]++);
 const td=perDay(()=>1),dd=perDay(d=>d.de.length),sd=perDay(d=>shipped(d)),ft=fileTypes(),days=new Set(DATA.map(d=>DAY(d.t))).size;
 const card=(ic_,t,body,sub,tb,cls)=>`<div class="card cc ${cls||''}"><div class="lb">${ic(ic_)}${t}</div>${body}${sub?`<div class="small mute" style="margin-top:6px">${sub}</div>`:''}${tb||''}</div>`;
 return `<div class="cgrid">`
 +card('steps','Plan completion',`<div class="row" style="flex-wrap:nowrap;gap:16px">${ringSvg(f,Math.round(f*100)+'%','of steps')}<div style="flex:1;min-width:0">${stackHtml([{l:'Finished',v:st.done,c:'var(--blk-done)'},{l:'Waiting on you',v:st.wait,c:'var(--blk-wait)'},{l:'Plan unfinished',v:st.open,c:'var(--blk-open)'}])}</div></div>`,s.dn+' of '+s.all.length+' steps done across '+N+' tasks.',tbl([['Finished tasks',st.done],['Waiting on you',st.wait],['Plan unfinished',st.open]]))
 +card('task','Tasks per day',barsSvg(td,'tasks','var(--gold)'),'How much work landed each day.',tbl(td.map(r=>[r.l,r.v])))
 +card('file','What changed, by file type',ft.length?hbarsSvg(ft,'edits','var(--good)'):'<div class="small mute">No files were changed.</div>','Edits summed over all tasks.',tbl(ft.map(r=>[r.l,r.v])))
 +card('dec','Decisions and shipped work',`<div class="small mute">Decisions per day</div>${barsSvg(dd,'decisions','var(--info)',70)}<div class="small mute" style="margin-top:8px">Shipped per day (commits, deploys, links)</div>${barsSvg(sd,'shipped','var(--good)',70)}`,'',tbl(dd.map((r,i)=>[r.l,r.v+' decisions, '+sd[i].v+' shipped'])))
 +(days>=6?card('task','Work calendar',`<div style="overflow-x:auto">${heatSvg(td)}</div>`,'Darker means more tasks that day.',tbl(td.map(r=>[r.l,r.v])),'wide'):'')
 +`</div>`}
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);
function showTip(e){const t=e.target&&e.target.closest?e.target.closest('[data-tip]'):null;if(!t){tipEl.classList.remove('on');return}tipEl.textContent=t.dataset.tip;tipEl.classList.add('on');const b=t.getBoundingClientRect(),x=e.clientX||b.left+b.width/2,y=e.clientY||b.top;tipEl.style.left=Math.max(6,Math.min(x+12,innerWidth-tipEl.offsetWidth-8))+'px';tipEl.style.top=Math.max(6,y-34)+'px'}
document.addEventListener('pointermove',showTip);document.addEventListener('focusin',showTip);document.addEventListener('focusout',()=>tipEl.classList.remove('on'));
function blk(i,ok){const d=DATA[i],full=frac(d)>=1;return `<button class="blk ${full?'full':''} ${i==cur?'sel':''} ${ok?'':'dim'}" data-open="${i}" style="background:${fillBg(d)}" aria-label="Task ${i+1}: ${esc(d.ti)}" title="${esc(d.ti)}"><span>${i+1}</span>${d.de.length?'<i>◆</i>':shipped(d)?'<i>▲</i>':''}</button>`}

function filters(){$('filters').innerHTML=Object.entries(F).map(([k,v])=>`<button data-flt="${k}" class="${k==flt?'on':''}">${v[0]} ${DATA.filter(d=>v[1](d)).length}</button>`).join('')}
function tasks(){filters();$('lv').textContent=lm?'Block view':'List view';$('lv').setAttribute('aria-pressed',lm);let n=0;
 if(lm){const L=DATA.map((d,i)=>i).filter(vis).reverse();n=L.length;$('days').innerHTML=L.map(i=>{const d=DATA[i],s=status(d);return `<button class="item" data-open="${i}"><span class="n">${String(i+1).padStart(2,'0')}</span><span class="b"><span class="t">${esc(d.ti)}</span>${d.tr.length?`<span class="sn">${esc((d.tr.find(x=>x[1]=='d')||d.tr[0])[0].slice(0,150))}</span>`:''}<span class="small mute" style="display:block">${dt(d.t)}${d.de.length?' · '+d.de.length+' decision'+(d.de.length>1?'s':''):''}${d.nfl?' · '+d.nfl+' file'+(d.nfl>1?'s':''):''}</span></span><span class="pill ${s}">${LAB[s]}</span></button>`}).join('')||'<p class="mute">No task matches. Clear the search or pick All.</p>'}
 else{const g={};DATA.forEach((d,i)=>{const x=U(d.t),k=x.getUTCFullYear()*10000+x.getUTCMonth()*100+x.getUTCDate();(g[k]=g[k]||[]).push(i)});
  $('days').innerHTML=Object.keys(g).sort((a,b)=>a-b).map(k=>{const x=U(DATA[g[k][0]].t);return `<div class="day"><div class="d">${x.getUTCDate()} ${MO[x.getUTCMonth()]}</div><div class="blks">${g[k].map(i=>{const v=vis(i);if(v)n++;return blk(i,v)}).join('')}</div></div>`}).join('')}
 $('count').textContent=n+' of '+N+' shown'}

function decs(){const L=[];DATA.forEach((d,i)=>d.de.forEach(y=>L.push([i,y])));L.reverse();const ans=L.filter(x=>x[1].a).length,dpd=L.length?perDay(d=>d.de.length):[];
 $('v-decs').innerHTML=`<div class="row sp" style="margin-bottom:12px"><h2>${L.length} decision${L.length==1?'':'s'}</h2><span class="small mute">Newest first. Your answer is in green.</span></div>${L.length?`<div class="cgrid"><div class="card cc"><div class="lb">${ic('dec')}Answered</div>${stackHtml([{l:'Answered',v:ans,c:'var(--good)'},{l:'No answer recorded',v:L.length-ans,c:'var(--blk-wait)'}])}</div><div class="card cc"><div class="lb">${ic('task')}Decisions per day</div>${barsSvg(dpd,'decisions','var(--info)',80)}</div></div>`:''}<div class="tl">`+(L.map(([i,y])=>`<div class="tn ${y.a?'':'q'}"><div class="card" style="margin:0"><div style="margin-bottom:8px;font-family:var(--serif);font-size:16px">${esc(y.q)}</div><div>${y.o.map(o=>`<span class="cp ${y.a&&y.a.toLowerCase()==o.toLowerCase()?'pick':''}">${y.a&&y.a.toLowerCase()==o.toLowerCase()?'✓ ':''}${esc(o)}</span>`).join('')}</div><div class="small mute" style="margin-top:4px">${y.a?'Your answer: "'+esc(y.a)+'"':'No answer recorded.'} · <a href="#t${i+1}" data-open="${i}">Task ${i+1}</a> · ${dt(DATA[i].t)}</div></div></div>`).join('')||'<p class="mute">No decisions were needed.</p>')+'</div>'}

function chg(){const F2={};DATA.forEach((d,i)=>Object.entries(d.fl).forEach(([k,v])=>{const o=F2[k]=F2[k]||{n:0,t:[]};o.n+=v;o.t.push(i)}));
 const fl=Object.entries(F2).sort((a,b)=>b[1].n-a[1].n),lim=showAll?fl.length:40,mx=fl.length?fl[0][1].n:1;
 const sec=(t,k,rows)=>rows.length?`<div class="card"><div class="lb">${ic(k)}${t}</div>${rows.join('')}</div>`:'';
 const ref=i=>`<a href="#t${i+1}" data-open="${i}">Task ${i+1}</a>`;
 const cm=[],dp=[],ln=[];DATA.forEach((d,i)=>{d.cm.forEach(c=>cm.push(`<div class="fd">${esc(c)} <span class="small mute">· ${ref(i)}</span></div>`));d.dp.forEach(c=>dp.push(`<div class="fd">${esc(c)} <span class="small mute">· ${ref(i)}</span></div>`));d.ln.forEach(l=>ln.push(`<div class="fd"><a href="https://claude.ai/artifact/${esc(l)}">artifact ${esc(l.slice(0,6))}</a> <span class="small mute">· ${ref(i)}</span></div>`))});
 const ftc=fl.length?`<div class="card"><div class="lb">${ic('file')}By file type</div>${hbarsSvg(fileTypes(),'edits','var(--good)')}</div>`:'';
 $('v-chg').innerHTML=ftc+(fl.length?`<div class="card"><div class="lb">${ic('file')}${fl.length} file${fl.length==1?'':'s'} changed</div><table><tr><th>File</th><th class="num">Edits</th><th>Tasks</th></tr>${fl.slice(0,lim).map(([k,o])=>`<tr><td style="overflow-wrap:anywhere">${esc(k)}</td><td class="num"><span class="eb" style="width:${Math.max(4,o.n/mx*70)}px"></span>${o.n}</td><td>${o.t.slice(-4).map(ref).join(', ')}${o.t.length>4?' +'+(o.t.length-4):''}</td></tr>`).join('')}</table>${fl.length>40?`<button id="sa" style="margin-top:10px">${showAll?'Show fewer':'Show all '+fl.length}</button>`:''}</div>`:'')+sec('Commits','task',cm)+sec('Deployed','ship',dp)+sec('Published','ship',ln)||'<p class="mute">Nothing was changed.</p>';
 const sa=$('sa');if(sa)sa.onclick=()=>{showAll=!showAll;chg()}}

function need(){const w=DATA.map((d,i)=>i).filter(i=>DATA[i].ask).reverse();
 $('v-need').innerHTML=w.length?`<h2>${w.length} task${w.length==1?'':'s'} wait${w.length==1?'s':''} on you</h2>`+w.map(i=>`<div class="need"><div class="t"><i class="pulse"></i>Task ${i+1} · ${dt(DATA[i].t)}</div><div style="margin-bottom:8px;font-family:var(--serif);font-size:16px">${esc(DATA[i].ask)}</div><div>${DATA[i].op.map(o=>optChip(i,o)).join('')}</div><button data-open="${i}">Open task</button></div>`).join(''):'<div class="card"><div class="lb">'+ic('steps')+'All clear</div><b style="font:500 20px var(--serif)">Nothing waits on you.</b><div class="mute">Every question was answered, or none was asked.</div></div>'}

const ago=iso=>{const m=(Date.now()-Date.parse(iso))/60000;return isNaN(m)?'':m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
function liveHtml(){const L=LIVE;if(!L)return'';return `<div class="card live"><div class="lb"><i class="pulse"></i>Live now${L.at?' · '+esc(ago(L.at)):''}</div><div class="goal" style="font-size:19px">${esc(L.line||'')}</div>${(L.steps||[]).slice(0,10).map(x=>{const k=x.s=='c'?'c':x.s=='i'?'i':'p';return `<div class="step ${k=='c'?'d':''}" style="color:${k=='p'?'var(--mute)':'var(--fg)'}"><span class="dot" style="background:${k=='c'?'var(--goodbg)':k=='i'?'var(--infobg)':'var(--soft)'};color:${k=='c'?'var(--good)':k=='i'?'var(--info)':'var(--mute)'}">${k=='c'?'✓':k=='i'?'…':'·'}</span>${esc(x.c||'')}</div>`}).join('')}</div>`}
const ACT=[['ok','Looks right'],['redo','Redo this'],['why','Explain why'],['stop','Stop here']];
async function sendIn(row){if(!DB||!CAN){toast('Sending is not available here');return false}
 try{await DB.collection('inbox').add(Object.assign({status:'queued',at:new Date().toISOString()},row));toast('Sent. The agent reads it on its next turn.');return true}catch(e){toast('Could not send ('+((e&&e.code)||'error')+')');return false}}
const sentFor=n=>INB.filter(r=>+r.task==n);
function actHtml(i){const n=i+1,rows=sentFor(n),mine=l=>rows.find(r=>r.text==l&&r.status!='done');
 const b=ACT.map(([k,l])=>{const r=mine(l);return `<button class="cp ${r?'pick':''}" data-act="${k}" data-lab="${l}" ${r?'disabled':''}>${r?esc(l)+' · '+esc(r.status||'queued'):esc(l)}</button>`}).join('');
 const last=rows.filter(r=>r.reply)[0];
 return (CAN?`<div class="small mute" style="width:100%">Quick actions for the agent</div>${b}`:'')+(CM?'<button id="dm">Comment on this task</button>':'')+(last?`<div class="fd" style="width:100%"><span class="small mute">Agent reply · ${esc(last.text)}</span><br>${esc(last.reply)}</div>`:'')}
function paintAct(){if(cur<0)return;$('dact').hidden=!(CM||CAN);$('dact').innerHTML=actHtml(cur)}
function pauseState(){const r=INB.find(x=>x.kind=='pause'||x.kind=='resume');return r&&r.kind=='pause'?'pause':'run'}
function paintTop(){const q=INB.filter(r=>r.status=='queued').length;$('qs').textContent=DB?(q?q+' action'+(q>1?'s':'')+' waiting for the agent':''):'';$('pz').hidden=!(DB&&CAN);$('pz').textContent=pauseState()=='pause'?'Resume run':'Pause run'}
async function startLive(){if(!META.live||!window.claude||!claude.use)return;
 const g=n=>claude.use(n).catch(()=>null);const [db,user,cm]=await Promise.all([g('db'),g('user'),g('comments')]);
 CM=cm||null;if(!db){if(CM){refresh();paintAct()}return}DB=db;try{CAN=user?!!(await user.canEdit()):false}catch(e){CAN=false}
 refresh();if(view=='need')need();paintAct();paintTop();
 db.doc('live/style').onSnapshot(x=>{if(x.exists){applyStyle(x.data());refresh()}},()=>{});
 db.doc('live/now').onSnapshot(x=>{LIVE=x.exists?x.data():null;if($('live'))$('live').innerHTML=liveHtml()},()=>{});
 db.collection('inbox').orderBy('at','desc').limit(80).onSnapshot(x=>{INB=x.docs.map(d=>Object.assign({id:d.id},d.data()));paintTop();paintAct();if(view=='need')need()},e=>{$('qs').textContent='Actions stopped ('+((e&&e.code)||'error')+'). Reload the page.'})}
function steps(st){const d=DATA[cur],n=st.filter(x=>x=='c').length,f=d.st.length?n/d.st.length:1;
 $('rg').setAttribute('stroke-dasharray',(f*113.1).toFixed(1)+' 113.1');$('rg').setAttribute('stroke',f>=1?'var(--blk-done)':'var(--blk-open)');
 if(!d.st.length){$('steps').innerHTML='<div class="small mute">No plan was kept for this task, so there are no steps to show.</div>';$('pct').textContent='No plan kept';return}
 $('steps').innerHTML=d.st.map((s,i)=>{const k=st[i],bg=k=='c'?'var(--goodbg)':k=='i'?'var(--infobg)':'var(--soft)',c=k=='c'?'var(--good)':k=='i'?'var(--info)':'var(--mute)';return `<div class="step ${k=='c'?'d':''}" style="color:${k=='p'?'var(--mute)':'var(--fg)'}"><span class="dot" style="background:${bg};color:${c}">${k=='c'?'✓':k=='i'?'…':'·'}</span>${esc(s[0])}</div>`}).join('');
 $('pct').textContent=n+' of '+d.st.length+' steps done'}
function detail(reveal){const d=DATA[cur];
 $('when').textContent='Task '+(cur+1)+' of '+N+' · '+dt(d.t)+' · '+fm(Math.max(0,d.e-d.t));$('title').textContent=d.ti;$('raw').textContent='You said: "'+d.g+'"';
 document.querySelectorAll('#db .lb[data-ic]').forEach(l=>{if(!l.firstElementChild||l.firstElementChild.tagName!='svg')l.insertAdjacentHTML('afterbegin',ic(l.dataset.ic))});
 $('trace').innerHTML=d.tr.length?d.tr.map(x=>`<div class="tr ${x[1]=='d'?'d':''}">${esc(x[0])}</div>`).join('')+'<div class="small mute">Short notes the agent wrote while it worked. A diamond marks a decision.</div>':'<div class="small mute">The agent wrote no reasoning notes for this task.</div>';
 $('finds').innerHTML=d.fi.map(f=>`<div class="fd">${esc(f.x)}<div class="small mute">${dt(f.t)}</div></div>`).join('')||'<div class="small mute">No result was written down for this task.</div>';
 $('decs').innerHTML=d.de.map(x=>`<div style="margin-bottom:10px"><div style="margin-bottom:6px">${esc(x.q)}</div><div>${x.o.map(o=>`<span class="cp ${x.a&&x.a.toLowerCase()==o.toLowerCase()?'pick':''}">${x.a&&x.a.toLowerCase()==o.toLowerCase()?'✓ ':''}${esc(o)}</span>`).join('')}</div><div class="small mute">${x.a?'Your answer: "'+esc(x.a)+'"':'No answer recorded.'}</div></div>`).join('')||'<div class="small mute">No decisions were needed.</div>';
 const fl=Object.entries(d.fl),o=[];if(fl.length)o.push(['Files',fl.map(([k,v])=>`<span class="cp">${esc(k)}${v>1?' ×'+v:''}</span>`).join('')+(d.nfl>fl.length?`<span class="cp">+${d.nfl-fl.length} more</span>`:'')]);
 if(d.cm.length)o.push(['Commits',d.cm.map(c=>`<span class="cp">${esc(c)}</span>`).join('')]);if(d.dp.length)o.push(['Deployed',d.dp.map(c=>`<span class="cp">${esc(c)}</span>`).join('')]);
 if(d.ln.length)o.push(['Published',d.ln.map(l=>`<a class="cp" href="https://claude.ai/artifact/${esc(l)}">artifact ${esc(l.slice(0,6))}</a>`).join('')]);
 $('outs').innerHTML=o.map(x=>`<div style="margin-bottom:6px"><span class="small mute">${x[0]}</span><div>${x[1]}</div></div>`).join('')||'<div class="small mute">Nothing was changed. This task only looked or answered.</div>';
 $('need').hidden=!d.ask;$('ask').textContent=d.ask;$('opts').innerHTML=d.op.map(x=>optChip(cur,x)).join('');
 paintAct();
 if(!reveal){steps(d.st.map(s=>s[1]));[1,2,3,4,5].forEach(i=>sec('s'+i,true))}}
const sec=(id,on)=>{$(id).style.opacity=on?1:.12};
function open(i){if(i<0||i>=N)return;stopRp();cur=i;if(!$('dr').classList.contains('open'))opener=document.activeElement;
 $('dr').classList.add('open');$('ov').classList.add('open');$('dr').setAttribute('aria-hidden','false');$('main').inert=true;detail(false);$('db').scrollTop=0;
 try{history.replaceState(null,'','#t'+(i+1))}catch(e){}if(view=='tasks'||view=='over')refresh();$('x').focus()}
function close(){stopRp();$('dr').classList.remove('open');$('ov').classList.remove('open');$('dr').setAttribute('aria-hidden','true');$('main').inert=false;
 try{history.replaceState(null,'','#'+view)}catch(e){}if(opener&&opener.isConnected)opener.focus();cur=-1;refresh()}
function refresh(){if(view=='tasks')tasks();else if(view=='over')over()}
function nextI(i,dir){for(let k=i;k>=0&&k<N;k+=dir)if(vis(k))return k;return -1}
function step(dir){const k=nextI(cur+dir,dir);if(k>=0)open(k)}
function stopRp(){rp=false;clearTimeout(timer);$('rp').textContent='Replay'}
function play(i){i=nextI(i,1);if(i<0){stopRp();return}
 cur=i;$('dr').classList.add('open');$('ov').classList.add('open');$('main').inert=true;detail(true);if(view=='tasks'||view=='over')refresh();const d=DATA[i];[1,2,3,4,5].forEach(k=>sec('s'+k,false));const n=d.st.length;let k=0;steps(d.st.map(()=>'p'));sec('s1',true);
 const ORD=[5,2,3,4],reveal=j=>{if(!rp)return;if(j>=ORD.length){timer=setTimeout(()=>play(i+1),700);return}sec('s'+ORD[j],true);timer=setTimeout(()=>reveal(j+1),450)};
 const tick=()=>{if(!rp)return;if(k<n){steps(d.st.map((s,j)=>j<k?d.st[j][1]:j==k?'i':'p'));k++;timer=setTimeout(tick,380)}else{steps(d.st.map(s=>s[1]));reveal(0)}};tick()}
function taskText(i){const d=DATA[i];return ['Task '+(i+1)+': '+d.ti+' ('+dt(d.t)+')','You said: "'+d.g+'"',d.st.length?'Steps: '+d.st.map(s=>(s[1]=='c'?'[x] ':'[ ] ')+s[0]).join('; '):'','Found: '+d.fi.map(f=>f.x).join(' '),d.de.length?'Decisions: '+d.de.map(y=>y.q+' -> '+(y.a||'no answer')).join('; '):'',d.nfl?'Files: '+Object.keys(d.fl).join(', '):'',d.cm.length?'Commits: '+d.cm.join('; '):'',d.dp.length?'Deployed: '+d.dp.join('; '):'',d.ask?'Needs you: '+d.ask:''].filter(Boolean).join('\n')}
function report(){const s=stat();return ['# '+META.name,'','Goal: '+(META.goal||(DATA[0]&&DATA[0].g)||''),'',...(META.paras||[]),'',s.dn+' of '+s.all.length+' steps done. '+s.dec+' decisions. '+s.files+' files changed. '+s.w+' waiting on you.','','## Tasks',...DATA.map((d,i)=>(i+1)+'. '+d.ti+' - '+LAB[status(d)]+' ('+dt(d.t)+')')].join('\n')}

document.addEventListener('click',async e=>{const an=e.target.closest('[data-ans]');if(an){if(await sendIn({kind:'answer',task:+an.dataset.ans+1,text:an.dataset.opt}))an.classList.add('pick');return}
 const ac=e.target.closest('[data-act]');if(ac){await sendIn({kind:ac.dataset.act,text:ac.dataset.lab,task:cur+1});return}
 if(e.target.id=='pz'){const st=pauseState();await sendIn({kind:st=='pause'?'resume':'pause',text:st=='pause'?'Resume run':'Pause run',task:0});return}
 if(e.target.id=='dm'&&CM){CM.openComposer({element:$('title')}).catch(()=>toast('Comments are not available'));return}
 const o=e.target.closest('[data-open]');if(o){e.preventDefault();open(+o.dataset.open);return}
 const t=e.target.closest('[data-tab]');if(t){go(t.dataset.tab,t.dataset.flt);return}
 const f=e.target.closest('#filters [data-flt]');if(f){flt=f.dataset.flt;tasks()}});
$('x').onclick=close;$('ov').onclick=close;$('pv').onclick=()=>step(-1);$('nx').onclick=()=>step(1);
$('dc').onclick=()=>copy(taskText(cur));$('dl').onclick=()=>{copy(location.href.split('#')[0]+'#t'+(cur+1))};
$('cp').onclick=()=>copy(report());
$('lv').onclick=()=>{lm=!lm;tasks()};
$('q').oninput=e=>{qs=e.target.value.toLowerCase().trim();tasks()};
$('rp').onclick=()=>{if(rp){stopRp();return}rp=true;$('rp').textContent='Stop';play(0)};
$('hb').onclick=()=>{const h=$('help');h.hidden=!h.hidden;$('hb').setAttribute('aria-expanded',!h.hidden)};
$('theme').onclick=()=>{const r=document.documentElement,dark=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))=='dark';r.dataset.theme=dark?'light':'dark'};
document.addEventListener('keydown',e=>{const open_=$('dr').classList.contains('open');
 if(e.key=='Escape'){if(!$('help').hidden){$('hb').click();return}if(open_)close();return}
 if(e.key=='Tab'&&open_){const f=[...$('dr').querySelectorAll('button,a[href]')].filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement==a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement==z){e.preventDefault();a.focus()}return}
 if(e.target.tagName=='INPUT'||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key>='1'&&+e.key<=TABS.length){close();go(TABS[+e.key-1][0])}
 else if(e.key=='/'){e.preventDefault();close();go('tasks');$('q').focus()}
 else if(e.key=='j'||e.key=='ArrowRight'){if(open_)step(1)}
 else if(e.key=='k'||e.key=='ArrowLeft'){if(open_)step(-1)}
 else if(e.key=='r')$('rp').click();
 else if(e.key=='?')$('hb').click()});
applyStyle(META.style);$('h1').textContent=META.name;
if(N){$('sub').textContent=N+' tasks · '+dt(DATA[0].t)+' to '+dt(DATA[N-1].e);$('cov').textContent=META.note;
 const h=(location.hash||'').slice(1),m=/^t(\d+)$/.exec(h);go(TABS.some(t=>t[0]==h)?h:'over');if(m&&+m[1]>=1&&+m[1]<=N)open(+m[1]-1)}
else{$('sub').textContent='No tasks with work were found in this session.';$('tabs').hidden=true}
startLive();
</script>
</html>
